# OpenShift S2I Build & Deployment Configuration (Zero External Registry)
quarkus.kubernetes-client.trust-certs=true
quarkus.container-image.builder=openshift
quarkus.openshift.build-strategy=binary
quarkus.openshift.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-21-runtime:1.20
quarkus.openshift.deployment-kind=Deployment
quarkus.openshift.route.expose=true
quarkus.openshift.route.tls.termination=edge
quarkus.openshift.route.tls.insecure-edge-termination-policy=Redirect
quarkus.openshift.labels."app.openshift.io/runtime"=quarkus
quarkus.openshift.labels."app.kubernetes.io/part-of"=lightwell-renovate-demo
