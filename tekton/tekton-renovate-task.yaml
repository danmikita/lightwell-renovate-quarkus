apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: renovate-remediate
  labels:
    app.kubernetes.io/part-of: lightwell-renovate-demo
spec:
  description: >-
    Runs Renovate CLI against a target repository to automatically remediate
    vulnerable Maven dependencies using the Lightwell artifact repository.
  params:
    - name: git-repo
      type: string
      description: The target repository identifier (e.g. org/lightwell-quarkus-quickstart)
    - name: renovate-secret-name
      type: string
      description: Kubernetes Secret containing RENOVATE_TOKEN and RENOVATE_PLATFORM
      default: renovate-credentials
  steps:
    - name: run-renovate
      image: docker.io/renovate/renovate:latest
      env:
        - name: RENOVATE_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.renovate-secret-name)
              key: RENOVATE_TOKEN
        - name: RENOVATE_PLATFORM
          valueFrom:
            secretKeyRef:
              name: $(params.renovate-secret-name)
              key: RENOVATE_PLATFORM
        - name: RENOVATE_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: $(params.renovate-secret-name)
              key: RENOVATE_ENDPOINT
              optional: true
        - name: RENOVATE_HOST_RULES
          valueFrom:
            secretKeyRef:
              name: $(params.renovate-secret-name)
              key: RENOVATE_HOST_RULES
              optional: true
        - name: RENOVATE_ONBOARDING
          value: "false"
        - name: RENOVATE_REQUIRE_CONFIG
          value: "optional"
        - name: LOG_LEVEL
          value: info
      args:
        - "$(params.git-repo)"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: renovate-remediate-pipeline
  labels:
    app.kubernetes.io/part-of: lightwell-renovate-demo
spec:
  description: >-
    Scans a GitHub repository with Renovate CLI and opens a Pull Request to
    remediate vulnerable Maven dependencies using Red Hat Lightwell.
  params:
    - name: git-repo
      type: string
      description: The target GitHub repository (owner/repo)
      default: "danmikita/lightwell-renovate-quarkus"
    - name: renovate-secret-name
      type: string
      description: Kubernetes Secret containing Renovate and Lightwell credentials
      default: "renovate-credentials"
  tasks:
    - name: renovate-remediate
      taskRef:
        name: renovate-remediate
      params:
        - name: git-repo
          value: $(params.git-repo)
        - name: renovate-secret-name
          value: $(params.renovate-secret-name)
