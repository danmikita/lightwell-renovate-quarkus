apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: renovate-lightwell-run-
  labels:
    app.kubernetes.io/part-of: lightwell-renovate-demo
spec:
  pipelineSpec:
    params:
      - name: git-repo
        type: string
      - name: renovate-secret-name
        type: string
      - name: dry-run
        type: string
    tasks:
      - name: renovate-remediate
        taskRef:
          name: renovate-remediate
        params:
          - name: git-repo
            value: $(params.git-repo)
          - name: renovate-secret-name
            value: $(params.renovate-secret-name)
          - name: dry-run
            value: $(params.dry-run)
  params:
    - name: git-repo
      value: "danmikita/lightwell-renovate-quarkus"
    - name: renovate-secret-name
      value: "renovate-credentials"
    - name: dry-run
      value: "false"
